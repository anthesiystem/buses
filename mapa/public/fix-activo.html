<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Corrección Rápida - Columna Activo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        .status { padding: 15px; margin: 15px 0; border-radius: 8px; font-weight: 500; }
        .success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        .error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
        .btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin: 8px 0; transition: all 0.2s; }
        .btn:hover { background: #0056b3; transform: translateY(-1px); }
        .btn:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
        .btn.success { background: #28a745; }
        .btn.danger { background: #dc3545; }
        .loading { display: none; text-align: center; margin: 20px 0; }
        .code { background: #f8f9fa; padding: 12px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 13px; margin: 10px 0; border: 1px solid #e9ecef; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat { text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #dee2e6; }
        .stat-value { font-size: 24px; font-weight: bold; color: #007bff; }
        .stat-label { font-size: 12px; color: #6c757d; margin-top: 5px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Corrección Rápida - Error "Data too long for column 'activo'"</h1>
        
        <div id="loading" class="loading">
            <div>⏳ Analizando estructura de la base de datos...</div>
        </div>
        
        <div id="resultados" style="display: none;">
            <!-- Los resultados se cargarán aquí -->
        </div>
        
        <div id="acciones" style="display: none;">
            <h3>🚀 Acciones Disponibles</h3>
            <button class="btn" onclick="ejecutarCorreccion('corregir_estructura')" id="btnEstructura">
                🔨 Corregir Estructura de Columna
            </button>
            <button class="btn" onclick="ejecutarCorreccion('normalizar_datos')" id="btnDatos">
                🧹 Normalizar Datos Problemáticos
            </button>
            <button class="btn success" onclick="ejecutarCorreccion('correccion_completa')" id="btnCompleta">
                ✨ Corrección Completa (Recomendado)
            </button>
        </div>
        
        <div id="progreso" style="display: none;">
            <div class="loading">⚙️ Ejecutando corrección...</div>
        </div>
    </div>

    <script>
        async function diagnosticar() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch('api-diagnostico.php');
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultados').style.display = 'block';
                
                mostrarResultados(data);
                
                if (data.estado === 'requiere_correccion') {
                    document.getElementById('acciones').style.display = 'block';
                }
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultados').innerHTML = `
                    <div class="error">
                        <strong>❌ Error al conectar con la API:</strong> ${error.message}
                    </div>
                `;
                document.getElementById('resultados').style.display = 'block';
            }
        }
        
        function mostrarResultados(data) {
            const container = document.getElementById('resultados');
            
            if (data.error) {
                container.innerHTML = `
                    <div class="error">
                        <strong>❌ Error en el diagnóstico:</strong> ${data.mensaje}
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            // Estado general
            if (data.estado === 'ok') {
                html += `<div class="success"><strong>✅ Todo está correcto</strong> - No se requieren correcciones</div>`;
            } else {
                html += `<div class="warning"><strong>⚠️ Se requieren correcciones</strong> - Hay problemas que necesitan ser solucionados</div>`;
            }
            
            // Estadísticas
            html += `
                <h3>📊 Estadísticas</h3>
                <div class="grid">
                    <div class="stat">
                        <div class="stat-value">${data.datos.total_registros}</div>
                        <div class="stat-label">Total de Permisos</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" style="color: ${data.datos.problematicos > 0 ? '#dc3545' : '#28a745'}">${data.datos.problematicos}</div>
                        <div class="stat-label">Registros Problemáticos</div>
                    </div>
                </div>
            `;
            
            // Información de la columna
            html += `
                <h3>🔍 Análisis de la Columna "activo"</h3>
                <div class="code">
                    <strong>Tipo:</strong> ${data.columna.tipo}<br>
                    <strong>Permite NULL:</strong> ${data.columna.null}<br>
                    <strong>Valor por defecto:</strong> ${data.columna.default || 'NULL'}
                </div>
            `;
            
            if (data.columna.es_problematico) {
                html += `<div class="warning"><strong>⚠️ Problema de estructura:</strong> ${data.columna.razon}</div>`;
            } else {
                html += `<div class="success"><strong>✅ Estructura correcta:</strong> El tipo de dato es adecuado</div>`;
            }
            
            // Ejemplos de datos problemáticos
            if (data.datos.problematicos > 0) {
                html += `<h3>🧐 Ejemplos de Valores Problemáticos</h3>`;
                html += `<div class="code">`;
                data.datos.ejemplos_problematicos.forEach(ejemplo => {
                    html += `Valor: "${ejemplo.activo}" (${ejemplo.cantidad} registros)<br>`;
                });
                html += `</div>`;
            }
            
            // Scripts de corrección disponibles
            if (data.scripts_correccion.length > 0) {
                html += `<h3>🔧 Scripts de Corrección Disponibles</h3>`;
                data.scripts_correccion.forEach(script => {
                    html += `
                        <div class="info">
                            <strong>${script.descripcion}</strong><br>
                            <div class="code">${script.sql}</div>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
        }
        
        async function ejecutarCorreccion(accion) {
            // Deshabilitar botones
            document.querySelectorAll('button').forEach(btn => btn.disabled = true);
            document.getElementById('progreso').style.display = 'block';
            
            try {
                const formData = new FormData();
                formData.append('accion', accion);
                
                const response = await fetch('api-correccion.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                document.getElementById('progreso').style.display = 'none';
                
                if (result.ok) {
                    document.getElementById('resultados').innerHTML += `
                        <div class="success">
                            <strong>✅ Corrección ejecutada exitosamente</strong><br>
                            ${result.mensaje}
                        </div>
                    `;
                    
                    // Ocultar acciones ya que la corrección fue exitosa
                    document.getElementById('acciones').style.display = 'none';
                    
                    // Mostrar botón para re-diagnosticar
                    document.getElementById('resultados').innerHTML += `
                        <button class="btn" onclick="location.reload()">🔄 Verificar Corrección</button>
                    `;
                } else {
                    document.getElementById('resultados').innerHTML += `
                        <div class="error">
                            <strong>❌ Error en la corrección:</strong> ${result.mensaje}
                        </div>
                    `;
                }
                
            } catch (error) {
                document.getElementById('progreso').style.display = 'none';
                document.getElementById('resultados').innerHTML += `
                    <div class="error">
                        <strong>❌ Error al ejecutar corrección:</strong> ${error.message}
                    </div>
                `;
            } finally {
                // Re-habilitar botones
                document.querySelectorAll('button').forEach(btn => btn.disabled = false);
            }
        }
        
        // Ejecutar diagnóstico al cargar la página
        document.addEventListener('DOMContentLoaded', diagnosticar);
    </script>
</body>
</html>
