<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Modal Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-4">
        <h3>Test Carga de Usuarios en Modal</h3>
        
        <div class="mb-3">
            <button class="btn btn-primary" onclick="testCargarUsuarios()">Test Cargar Usuarios</button>
            <button class="btn btn-success" onclick="testCargarModulos()">Test Cargar Módulos</button>
            <button class="btn btn-warning" onclick="mostrarDebug()">Mostrar Debug</button>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <h5>Usuarios</h5>
                <select class="form-select" id="testSelectUsuarios">
                    <option>Cargando...</option>
                </select>
            </div>
            <div class="col-md-6">
                <h5>Módulos</h5>
                <select class="form-select" id="testSelectModulos">
                    <option>Cargando...</option>
                </select>
            </div>
        </div>
        
        <div class="mt-3">
            <pre id="debug" class="bg-light p-3"></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const apiBase = '/final/mapa/public/sections/usuarios/api/';
        const $ = (sel) => document.querySelector(sel);
        
        const globales = {
            usuarios: [],
            modulos: []
        };

        function fillSelect(selectElement, data, includeEmpty = true) {
            if (!selectElement) {
                console.error('Select element not found');
                return;
            }
            
            let optionsHtml = '';
            if (includeEmpty) {
                optionsHtml += '<option value="">Seleccionar...</option>';
            }
            
            if (!Array.isArray(data)) {
                console.error('Data is not an array:', data);
                selectElement.innerHTML = '<option>Error: datos inválidos</option>';
                return;
            }
            
            data.forEach(item => {
                let value = item.ID || item.id;
                let text = item.cuenta || item.descripcion || item.nombre || `${item.nombre || ''} ${item.apaterno || ''}`.trim() || 'Sin nombre';
                optionsHtml += `<option value="${value}">${text}</option>`;
            });
            
            selectElement.innerHTML = optionsHtml;
            console.log(`Select llenado con ${data.length} elementos`);
        }

        async function fetchJSON(url) {
            try {
                console.log(`Fetching: ${url}`);
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log(`Response text (first 200 chars): ${text.substring(0, 200)}`);
                
                const data = JSON.parse(text);
                console.log(`Parsed data:`, data);
                return data;
                
            } catch (error) {
                console.error(`Error fetching ${url}:`, error);
                return null;
            }
        }

        async function testCargarUsuarios() {
            console.log('=== TEST CARGAR USUARIOS ===');
            const usuarios = await fetchJSON(apiBase + 'usuarios_listar.php');
            
            if (usuarios) {
                globales.usuarios = usuarios;
                fillSelect($('#testSelectUsuarios'), usuarios, true);
                console.log(`Usuarios cargados: ${usuarios.length}`);
                
                Swal.fire({
                    title: 'Usuarios cargados',
                    text: `Se cargaron ${usuarios.length} usuarios`,
                    icon: 'success',
                    timer: 2000
                });
            } else {
                console.error('Error cargando usuarios');
                Swal.fire('Error', 'No se pudieron cargar los usuarios', 'error');
            }
        }

        async function testCargarModulos() {
            console.log('=== TEST CARGAR MÓDULOS ===');
            const modulos = await fetchJSON(apiBase + 'modulos_listar.php');
            
            if (modulos) {
                globales.modulos = modulos;
                fillSelect($('#testSelectModulos'), modulos, true);
                console.log(`Módulos cargados: ${modulos.length}`);
                
                Swal.fire({
                    title: 'Módulos cargados',
                    text: `Se cargaron ${modulos.length} módulos`,
                    icon: 'success',
                    timer: 2000
                });
            } else {
                console.error('Error cargando módulos');
                Swal.fire('Error', 'No se pudieron cargar los módulos', 'error');
            }
        }

        function mostrarDebug() {
            const debug = {
                usuarios: {
                    count: globales.usuarios.length,
                    sample: globales.usuarios.slice(0, 3)
                },
                modulos: {
                    count: globales.modulos.length,
                    sample: globales.modulos.slice(0, 3)
                },
                apiBase: apiBase
            };
            
            $('#debug').textContent = JSON.stringify(debug, null, 2);
        }

        // Auto-test al cargar la página
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Página cargada, iniciando auto-test...');
            await testCargarUsuarios();
            await testCargarModulos();
            mostrarDebug();
        });
    </script>
</body>
</html>
