<!DOCTYPE html>
<html>
<head>
    <title>Test Registro Descarga PDF</title>
</head>
<body>
    <h3>Test de Registro de Descarga PDF</h3>
    
    <form id="testForm">
        <div>
            <label>Estado:</label>
            <input type="text" name="estado" value="Test Estado" required>
        </div>
        <div>
            <button type="button" onclick="testRegistrarDescarga()">Test Registrar Descarga</button>
        </div>
    </form>
    
    <div id="resultado"></div>

    <script>
        async function testRegistrarDescarga() {
            const form = document.getElementById('testForm');
            const formData = new FormData(form);
            
            try {
                const response = await fetch('../registrar_descarga_pdf.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams(formData)
                });
                
                const contentType = response.headers.get('content-type') || '';
                console.log('Content-Type:', contentType);
                console.log('Status:', response.status);
                
                if (!contentType.includes('application/json')) {
                    const htmlResponse = await response.text();
                    console.error('Respuesta HTML:', htmlResponse);
                    document.getElementById('resultado').innerHTML = 
                        '<h4>Error - Respuesta no es JSON:</h4><pre>' + htmlResponse + '</pre>';
                    return;
                }
                
                const data = await response.json();
                document.getElementById('resultado').innerHTML = 
                    '<h4>Respuesta JSON:</h4><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('resultado').innerHTML = 
                    '<h4>Error JS:</h4><pre>' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
